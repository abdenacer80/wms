<body>
<div id="app"></div>
<script>
'use strict';

// ==================== DATABASE ====================
let db=null;
const DB_NAME='wms_pro_v1',DB_VER=1;

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      ['settings','warehouses','products','customers','suppliers','invoices','invoice_items','payments','movements'].forEach(s=>{
        if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true});
      });
      if(!d.objectStoreNames.contains('stock'))d.createObjectStore('stock',{keyPath:'key'});
    };
    r.onsuccess=()=>{db=r.result;res()};
    r.onerror=()=>rej(r.error);
  });
}
function store(n,m='readonly'){return db.transaction(n,m).objectStore(n)}
function p(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function req(n,k){return p(store(n).get(k))}
function all(n){return p(store(n).getAll())}
function add(n,v){return p(store(n,'readwrite').add(v))}
function put(n,v){return p(store(n,'readwrite').put(v))}

// ==================== UTILS ====================
const now=()=>new Date().toISOString();
const money=n=>Number(n||0).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dateStr=s=>s?new Date(s).toLocaleDateString('ar-EG'):'—';
const dateTimeStr=s=>s?new Date(s).toLocaleString('ar-EG'):'—';

async function setting(k,d=''){const r=await req('settings',k);return r?r.value:d}
async function setSetting(k,v){await put('settings',{key:k,value:v})}

async function getStock(pid,wid){const r=await req('stock',pid+'_'+wid);return r?r.quantity:0}
async function updateStock(pid,wid,delta){
  const key=pid+'_'+wid;
  const s=await req('stock',key);
  if(s) await put('stock',{...s,quantity:s.quantity+delta});
  else await put('stock',{key,productId:pid,warehouseId:wid,quantity:delta});
}

function genNum(type){
  const d=new Date();const ym=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0');
  const prefix={SALE:'SALE',PURCHASE:'PURC',SALE_RETURN:'SRET',PURCHASE_RETURN:'PRET'}[type];
  const rand=String(Math.floor(Math.random()*9999)+1).padStart(4,'0');
  return `${prefix}-${ym}-${rand}`;
}

// ==================== SEED ====================
async function seed(){
  if(await setting('seeded'))return;
  await setSetting('password','admin');
  await setSetting('company','شركتي');
  await setSetting('currency','ج.م');
  await setSetting('seeded','1');
  await add('warehouses',{name:'المخزن الرئيسي',code:'MAIN',address:'',created_at:now()});
}

// ==================== AUTH ====================
async function login(pass){return (await setting('password'))===pass}
async function changePass(v){await setSetting('password',v)}

// ==================== INVOICE ENGINE ====================
async function createInvoice(data){
  const isOut = data.type==='SALE' || data.type==='PURCHASE_RETURN';
  if(isOut){
    for(const it of data.items){
      const av=await getStock(it.productId,data.warehouseId);
      if(av<it.quantity){
        const pr=await req('products',it.productId);
        throw new Error(`المخزون غير كافٍ: ${pr.name} (المتاح ${av})`);
      }
    }
  }
  if(!data.items.length) throw new Error('أضف صنفًا واحدًا على الأقل');

  const calc=data.items.map(i=>({...i,line:+(i.quantity*i.unitPrice-i.discount).toFixed(2)}));
  const subtotal=+calc.reduce((s,i)=>s+i.line,0).toFixed(2);
  const taxable=Math.max(subtotal-(data.discount||0),0);
  const tax=+(taxable*(data.taxRate||0)/100).toFixed(2);
  const total=+(taxable+tax).toFixed(2);
  const paid=Math.min(data.paid||0,total);
  const due=+(total-paid).toFixed(2);
  const number=genNum(data.type);
  const partnerType=(data.type==='SALE'||data.type==='SALE_RETURN')?'customer':'supplier';

  const invId=await add('invoices',{
    number,type:data.type,status:'CONFIRMED',
    partnerType,partnerId:data.partnerId||null,
    warehouseId:data.warehouseId,
    subtotal,discount:data.discount||0,tax,total,paid,note:data.note||'',
    created_at:now()
  });

  for(const it of calc){
    let cost=0;
    if(data.type==='SALE'||data.type==='SALE_RETURN'){
      const pr=await req('products',it.productId);
      cost=pr.cost||0;
    }
    await add('invoice_items',{
      invoiceId:invId,productId:it.productId,
      quantity:it.quantity,unitPrice:it.unitPrice,discount:it.discount||0,total:it.line,cost
    });
    const sign=isOut?-1:1;
    await updateStock(it.productId,data.warehouseId,sign*it.quantity);
    await add('movements',{
      productId:it.productId,warehouseId:data.warehouseId,
      type:sign<0?'OUT':'IN',quantity:it.quantity,reference:number,
      reason:data.type,created_at:now()
    });
  }

  if(data.type==='PURCHASE'&&data.updateCost){
    for(const it of calc){
      const pr=await req('products',it.productId);
      await put('products',{...pr,cost:it.unitPrice});
    }
  }

  if(due>0&&data.partnerId){
    if(data.type==='SALE'){
      const c=await req('customers',data.partnerId);
      await put('customers',{...c,balance:(c.balance||0)+due});
    } else if(data.type==='PURCHASE'){
      const s=await req('suppliers',data.partnerId);
      await put('suppliers',{...s,balance:(s.balance||0)+due});
    } else if(data.type==='SALE_RETURN'){
      const c=await req('customers',data.partnerId);
      await put('customers',{...c,balance:(c.balance||0)-due});
    } else if(data.type==='PURCHASE_RETURN'){
      const s=await req('suppliers',data.partnerId);
      await put('suppliers',{...s,balance:(s.balance||0)-due});
    }
  }

  if(paid>0){
    await add('payments',{
      invoiceId:invId,amount:paid,method:data.paymentMethod||'CASH',
      partnerType,partnerId:data.partnerId||null,
      note:'دفعة أولى',created_at:now()
    });
  }

  return {id:invId,number};
}

async function addPayment(invoiceId,amount,method,note){
  const inv=await req('invoices',invoiceId);
  const remaining=inv.total-inv.paid;
  if(amount<=0) throw new Error('المبلغ يجب أن يكون موجبًا');
  if(amount>remaining+0.01) throw new Error(`المبلغ أكبر من المتبقي (${money(remaining)})`);

  await add('payments',{
    invoiceId,amount,method:method||'CASH',
    partnerType:inv.partnerType,partnerId:inv.partnerId,
    note:note||'',created_at:now()
  });
  await put('invoices',{...inv,paid:inv.paid+amount});

  if(inv.partnerId){
    if(inv.type==='SALE'){
      const c=await req('customers',inv.partnerId);
      await put('customers',{...c,balance:(c.balance||0)-amount});
    } else if(inv.type==='PURCHASE'){
      const s=await req('suppliers',inv.partnerId);
      await put('suppliers',{...s,balance:(s.balance||0)-amount});
    } else if(inv.type==='SALE_RETURN'){
      const c=await req('customers',inv.partnerId);
      await put('customers',{...c,balance:(c.balance||0)+amount});
    } else if(inv.type==='PURCHASE_RETURN'){
      const s=await req('suppliers',inv.partnerId);
      await put('suppliers',{...s,balance:(s.balance||0)+amount});
    }
  }
}

// ==================== TRANSFER & ADJUST ====================
async function transferStock(fromId,toId,items,note){
  if(fromId===toId) throw new Error('المخزنان متطابقان');
  for(const it of items){
    const av=await getStock(it.productId,fromId);
    if(av<it.quantity){
      const pr=await req('products',it.productId);
      throw new Error(`المخزون غير كافٍ: ${pr.name} (المتاح ${av})`);
    }
  }
  const ref='TRF-'+Date.now();
  for(const it of items){
    await updateStock(it.productId,fromId,-it.quantity);
    await add('movements',{productId:it.productId,warehouseId:fromId,type:'OUT',quantity:it.quantity,reference:ref,reason:'TRANSFER',note:note||'',created_at:now()});
    await updateStock(it.productId,toId,it.quantity);
    await add('movements',{productId:it.productId,warehouseId:toId,type:'IN',quantity:it.quantity,reference:ref,reason:'TRANSFER',note:note||'',created_at:now()});
  }
  return ref;
}

async function adjustStock(productId,warehouseId,newQty,note){
  const current=await getStock(productId,warehouseId);
  const delta=newQty-current;
  if(delta===0) return;
  await updateStock(productId,warehouseId,delta);
  await add('movements',{
    productId,warehouseId,type:'ADJUST',quantity:Math.abs(delta),
    reference:delta>0?'ADJ+':'ADJ-',
    reason:'ADJUST',note:note||`من ${current} إلى ${newQty}`,
    created_at:now()
  });
}

// ==================== REPORTS ====================
async function getDashboard(){
  const invoices=await all('invoices');
  const products=await all('products');
  const customers=await all('customers');
  const suppliers=await all('suppliers');
  const stock=await all('stock');
  const t=today();

  const salesToday=invoices.filter(i=>i.type==='SALE'&&i.created_at.slice(0,10)===t);
  const salesTotal=salesToday.reduce((s,i)=>s+i.total,0);

  const lowStock=[];
  for(const p of products.filter(x=>x.active!==0)){
    const q=stock.filter(s=>s.productId===p.id).reduce((s,x)=>s+x.quantity,0);
    if(q<=(p.reorder||0)) lowStock.push({id:p.id,name:p.name,stock:q,reorder:p.reorder||0});
  }

  const recent=invoices.filter(i=>i.type==='SALE').sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,5);
  const recentFull=[];
  for(const i of recent){
    const c=i.partnerId?await req('customers',i.partnerId):null;
    recentFull.push({number:i.number,customer:c?c.name:'نقدي',total:i.total,id:i.id});
  }

  const receivables=customers.reduce((s,c)=>s+(c.balance>0?c.balance:0),0);
  const payables=suppliers.reduce((s,c)=>s+(c.balance>0?c.balance:0),0);

  return {salesToday:salesTotal,invoiceCount:salesToday.length,products:products.filter(p=>p.active!==0).length,customers:customers.length,lowStock,recent:recentFull,receivables,payables};
}

async function getReport(fromDate,toDate){
  const invoices=await all('invoices');
  const items=await all('invoice_items');
  const products=await all('products');
  const customers=await all('customers');
  const stock=await all('stock');

  const inRange=invoices.filter(i=>{
    const d=i.created_at.slice(0,10);
    return d>=fromDate && d<=toDate;
  });
  const sales=inRange.filter(i=>i.type==='SALE');
  const purchases=inRange.filter(i=>i.type==='PURCHASE');
  const sReturns=inRange.filter(i=>i.type==='SALE_RETURN');
  const pReturns=inRange.filter(i=>i.type==='PURCHASE_RETURN');

  const revenue=sales.reduce((s,i)=>s+i.total,0)-sReturns.reduce((s,i)=>s+i.total,0);
  const purchasesTotal=purchases.reduce((s,i)=>s+i.total,0);

  const inRangeIds=new Set(inRange.map(i=>i.id));
  const relevantItems=items.filter(it=>inRangeIds.has(it.invoiceId));
  let cogs=0,profit=0;
  for(const it of relevantItems){
    const inv=inRange.find(i=>i.id===it.invoiceId);
    if(!inv) continue;
    if(inv.type==='SALE'){cogs+=it.cost*it.quantity;profit+=it.total-it.cost*it.quantity}
    else if(inv.type==='SALE_RETURN'){cogs-=it.cost*it.quantity;profit-=it.total-it.cost*it.quantity}
  }

  const pm=Object.fromEntries(products.map(p=>[p.id,p]));
  const prodMap={};
  for(const it of relevantItems){
    const inv=inRange.find(i=>i.id===it.invoiceId);
    if(!inv||inv.type!=='SALE') continue;
    if(!prodMap[it.productId]) prodMap[it.productId]={name:pm[it.productId]?.name||'—',qty:0,revenue:0};
    prodMap[it.productId].qty+=it.quantity;
    prodMap[it.productId].revenue+=it.total;
  }
  const topProducts=Object.values(prodMap).sort((a,b)=>b.revenue-a.revenue).slice(0,10);

  const cm=Object.fromEntries(customers.map(c=>[c.id,c]));
  const custMap={};
  for(const inv of sales){
    if(!inv.partnerId) continue;
    if(!custMap[inv.partnerId]) custMap[inv.partnerId]={name:cm[inv.partnerId]?.name||'—',count:0,total:0};
    custMap[inv.partnerId].count++;
    custMap[inv.partnerId].total+=inv.total;
  }
  const topCustomers=Object.values(custMap).sort((a,b)=>b.total-a.total).slice(0,10);

  const aging={a30:0,a60:0,a90:0,a90p:0};
  const today0=new Date();today0.setHours(0,0,0,0);
  for(const inv of invoices.filter(i=>i.type==='SALE'&&(i.total-i.paid)>0.01)){
    const days=Math.floor((today0-new Date(inv.created_at))/86400000);
    const bal=inv.total-inv.paid;
    if(days<=30) aging.a30+=bal;
    else if(days<=60) aging.a60+=bal;
    else if(days<=90) aging.a90+=bal;
    else aging.a90p+=bal;
  }

  const warehouses=await all('warehouses');
  const wm=Object.fromEntries(warehouses.map(w=>[w.id,w.name]));
  const invByWh={};
  for(const s of stock){
    if(!wm[s.warehouseId]) continue;
    if(!invByWh[s.warehouseId]) invByWh[s.warehouseId]={name:wm[s.warehouseId],value:0,items:0};
    invByWh[s.warehouseId].value+=s.quantity*(pm[s.productId]?.cost||0);
    invByWh[s.warehouseId].items++;
  }

  const low=[];
  for(const p of products.filter(x=>x.active!==0)){
    const q=stock.filter(s=>s.productId===p.id).reduce((s,x)=>s+x.quantity,0);
    if(q<=(p.reorder||0)) low.push({name:p.name,stock:q,reorder:p.reorder||0});
  }

  return {
    revenue,cogs,profit,purchases:purchasesTotal,
    invoiceCount:sales.length,
    topProducts,topCustomers,aging,
    inventoryByWarehouse:Object.values(invByWh),
    lowStock:low,
  };
}

// ==================== STATE ====================
const state={authed:false,page:'dashboard',param:null};
function goto(p,param=null){state.page=p;state.param=param;render()}

// ==================== LOGIN & SHELL ====================
function renderLogin(){
  document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="login-card">
    <h1>📦 نظام إدارة المخازن</h1>
    <div id="err" class="error"></div>
    <input id="pass" type="password" placeholder="كلمة المرور" autofocus>
    <button class="btn primary" onclick="doLogin()">دخول</button>
    <p style="margin-top:14px;font-size:12px;color:#94a3b8;text-align:center">افتراضي: <b>admin</b></p>
  </div></div>`;
  document.getElementById('pass').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin()});
}
async function doLogin(){
  const v=document.getElementById('pass').value;
  if(await login(v)){state.authed=true;state.page='dashboard';render()}
  else document.getElementById('err').textContent='كلمة المرور غير صحيحة';
}

const MENU=[
  {k:'dashboard',l:'📊 لوحة التحكم'},
  {k:'invoices',l:'🧾 الفواتير'},
  {k:'payments-page',l:'💵 المدفوعات'},
  {k:'transfers-page',l:'🔄 تحويل وتسوية'},
  {k:'products',l:'📦 المنتجات'},
  {k:'warehouses',l:'🏪 المخازن'},
  {k:'customers',l:'👥 العملاء'},
  {k:'suppliers',l:'🏭 الموردون'},
  {k:'movements-page',l:'📋 حركات المخزون'},
  {k:'reports',l:'📈 التقارير'},
  {k:'settings',l:'⚙️ الإعدادات'},
];

function render(){
  if(!state.authed){renderLogin();return}
  document.getElementById('app').innerHTML=`
    <aside class="sidebar">
      <h1>📦 WMS-Pro</h1>
      ${MENU.map(m=>`<button class="${state.page===m.k?'active':''}" onclick="goto('${m.k}')">${m.l}</button>`).join('')}
      <div style="flex:1"></div>
      <button onclick="logout()">🚪 خروج</button>
    </aside>
    <main class="main" id="pc"></main>`;
  renderPage();
}
function logout(){state.authed=false;render()}

function renderPage(){
  const el=document.getElementById('pc');if(!el)return;
  const p=state.page;
  if(p==='dashboard') return renderDashboard(el);
  if(p==='products') return renderProducts(el);
  if(p==='warehouses') return renderWarehouses(el);
  if(p==='customers') return renderCustomers(el);
  if(p==='suppliers') return renderSuppliers(el);
  if(p==='invoices') return renderInvoices(el);
  if(p==='new-invoice') return renderNewInvoice(el);
  if(p==='invoice-view') return renderInvoiceView(el);
  if(p==='payments-page') return renderPaymentsPage(el);
  if(p==='transfers-page') return renderTransfersPage(el);
  if(p==='movements-page') return renderMovementsPage(el);
  if(p==='reports') return renderReports(el);
  if(p==='settings') return renderSettings(el);
}

// ==================== DASHBOARD ====================
async function renderDashboard(el){

async function addProduct(){
  const sku=document.getElementById('p-sku').value.trim();
  const name=document.getElementById('p-name').value.trim();
  if(!sku||!name)return alert('SKU والاسم مطلوبان');
  if((await all('products')).find(p=>p.sku===sku))return alert('SKU مستخدم');
  await add('products',{
    sku,name,
    unit:document.getElementById('p-unit').value||'قطعة',
    cost:+document.getElementById('p-cost').value||0,
    price:+document.getElementById('p-price').value||0,
    tax:+document.getElementById('p-tax').value||0,
    reorder:+document.getElementById('p-reorder').value||0,
    active:1,created_at:now()
  });
  renderPage();
}
async function delProduct(id){
  if(!confirm('حذف المنتج؟'))return;
  const p=await req('products',id);
  await put('products',{...p,active:0});renderPage();
}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span>${paidLabel}:</span>
        <input style="width:130px" type="number" step="0.01" value="0" oninput="invForm.paid=+this.value||0;updateInv()"></div>

        <select style="width:130px" onchange="invForm.paymentMethod=this.value">
          <option value="CASH">نقدي</option><option value="CARD">بطاقة</option>
          <option value="TRANSFER">تحويل</option><option value="CREDIT">آجل</option>
        </select></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:14px"><span>المتبقي:</span><span class="mono" id="iv-due">0.00</span></div>
      <button class="btn success" style="width:100%" onclick="saveInvoice()">💾 حفظ الفاتورة</button>
    </div>
  </div>`;
  drawInvRows();
}

function drawInvRows(){
  const tbody=document.getElementById('inv-rows');if(!tbody)return;
  const products=window._ctx.products;
  tbody.innerHTML=invForm.items.map((it,i)=>{
    const line=+(it.quantity*it.unitPrice-it.discount).toFixed(2);
    return `<tr>
      <td><select onchange="pickProduct(${i},this.value)"><option value="">— اختر —</option>
        ${products.map(p=>`<option value="${p.id}" ${it.productId==p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select></td>
      <td><input class="w24" type="number" min="0.001" step="0.001" value="${it.quantity}" onchange="updItem(${i},'quantity',+this.value)"></td>
      <td><input class="w24" type="number" step="0.01" value="${it.unitPrice}" onchange="updItem(${i},'unitPrice',+this.value)"></td>
      <td><input class="w24" type="number" step="0.01" value="${it.discount}" onchange="updItem(${i},'discount',+this.value)"></td>
      <td class="mono" style="text-align:center">${line.toFixed(2)}</td>
      <td><button class="small-btn danger" onclick="delInvRow(${i})">✕</button></td>
    </tr>`;
  }).join('');
  updateInv();
}
function pickProduct(i,pid){
  const pr=window._ctx.products.find(x=>x.id==pid);
  invForm.items[i].productId=pid?+pid:null;
  if(pr)invForm.items[i].unitPrice=(window._ctx.type==='PURCHASE'||window._ctx.type==='PURCHASE_RETURN')?pr.cost:pr.price;
  drawInvRows();
}
function updItem(i,k,v){invForm.items[i][k]=v;drawInvRows()}
function delInvRow(i){invForm.items.splice(i,1);if(!invForm.items.length)invForm.items.push({productId:'',quantity:1,unitPrice:0,discount:0});drawInvRows()}
function addInvRow(){invForm.items.push({productId:'',quantity:1,unitPrice:0,discount:0});drawInvRows()}
function updateInv(){
  const sub=+invForm.items.reduce((s,i)=>s+(i.quantity*i.unitPrice-i.discount),0).toFixed(2);
  const taxable=Math.max(sub-invForm.discount,0);
  const tax=+(taxable*invForm.taxRate/100).toFixed(2);
  const total=+(taxable+tax).toFixed(2);
  const due=+(total-Math.min(invForm.paid,total)).toFixed(2);
  const $=id=>document.getElementById(id);
  if($('iv-sub'))$('iv-sub').textContent=sub.toFixed(2);
  if($('iv-total'))$('iv-total').textContent=total.toFixed(2);
  if($('iv-due'))$('iv-due').textContent=due.toFixed(2);
}
async function saveInvoice(){
  const err=document.getElementById('inv-err');err.innerHTML='';
  const items=invForm.items.filter(i=>i.productId);
  if(!items.length){err.innerHTML='<div class="card" style="background:#fee2e2;color:#991b1b;margin-bottom:12px">أضف صنفًا</div>';return}
  if(!invForm.warehouseId){err.innerHTML='<div class="card" style="background:#fee2e2;color:#991b1b;margin-bottom:12px">اختر المخزن</div>';return}
  try{
    const res=await createInvoice({
      type:window._ctx.type,
      partnerId:invForm.partnerId?+invForm.partnerId:null,
      warehouseId:+invForm.warehouseId,
      discount:invForm.discount,taxRate:invForm.taxRate,
      paid:invForm.paid,paymentMethod:invForm.paymentMethod,
      note:invForm.note,updateCost:invForm.updateCost,
      items:items.map(i=>({productId:+i.productId,quantity:+i.quantity,unitPrice:+i.unitPrice,discount:+i.discount||0}))
    });
    goto('invoice-view',res.id);
  }catch(e){
    err.innerHTML=`<div class="card" style="background:#fee2e2;color:#991b1b;margin-bottom:12px">${esc(e.message)}</div>`;
  }
}

async function renderTransfersPage(el){
  const [warehouses,products,stock]=await Promise.all([all('warehouses'),all('products'),all('stock')]);
  const activeProducts=products.filter(p=>p.active!==0);
  window._tr={warehouses,products:activeProducts,stock};
  el.innerHTML=`<h2>تحويل وتسوية المخزون</h2>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('transfer')">🔄 تحويل بين المخازن</button>
    <button class="tab" onclick="switchTab('adjust')">🔧 تسوية جرد</button>
  </div>
  <div id="tab-content"></div>`;
  switchTab('transfer');
}
function switchTab(t){
  document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tabs .tab').forEach(x=>{if(x.textContent.includes(t==='transfer'?'تحويل':'تسوية'))x.classList.add('active')});
  const el=document.getElementById('tab-content');
  if(t==='transfer') renderTransferForm(el);
  else renderAdjustForm(el);
}
function renderTransferForm(el){
  const {warehouses,products}=window._tr;
  window._trf={fromId:warehouses[0]?.id||'',toId:warehouses[1]?.id||'',items:[{productId:'',quantity:1}],note:''};
  el.innerHTML=`<div class="card form-row" style="margin-bottom:12px">
    <div><label style="font-size:12px;color:#64748b">من مخزن</label>
      <select onchange="_trf.fromId=+this.value">${warehouses.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div>
    <div><label style="font-size:12px;color:#64748b">إلى مخزن</label>
      <select onchange="_trf.toId=+this.value">${warehouses.map(w=>`<option value="${w.id}" ${w.id===warehouses[1]?.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>
    <div><label style="font-size:12px;color:#64748b">ملاحظة</label>
      <input oninput="_trf.note=this.value"></div>
  </div>
  <div class="card" style="padding:0;margin-bottom:10px"><table>
    <thead><tr><th>المنتج</th><th>الكمية</th><th></th></tr></thead>
    <tbody id="tr-rows"></tbody>
  </table></div>
  <button class="link" onclick="addTrRow()">➕ إضافة صنف</button>
  <div style="margin-top:14px"><button class="btn primary" onclick="doTransfer()">تنفيذ التحويل</button></div>`;
  drawTrRows();
}
function drawTrRows(){
  const tb=document.getElementById('tr-rows');if(!tb)return;
  const {products,stock}=window._tr;
  tb.innerHTML=window._trf.items.map((it,i)=>{
    return `<tr>
      <td><select onchange="_trf.items[${i}].productId=+this.value;drawTrRows()"><option value="">— اختر —</option>
        ${products.map(p=>`<option value="${p.id}" ${it.productId==p.id?'selected':''}>${esc(p.name)} (متاح: ${stock.filter(s=>s.productId===p.id&&s.warehouseId===window._trf.fromId).reduce((a,x)=>a+x.quantity,0)})</option>`).join('')}</select></td>
      <td><input class="w24" type="number" min="0.001" step="0.001" value="${it.quantity}" onchange="_trf.items[${i}].quantity=+this.value"></td>
      <td><button class="small-btn danger" onclick="_trf.items.splice(${i},1);if(!_trf.items.length)_trf.items.push({productId:0,quantity:1});drawTrRows()">✕</button></td>
    </tr>`;
  }).join('');
}
function addTrRow(){window._trf.items.push({productId:'',quantity:1});drawTrRows()}
async function doTransfer(){
  const items=window._trf.items.filter(i=>i.productId);
  if(!items.length)return alert('أضف صنفًا');
  if(window._trf.fromId===window._trf.toId)return alert('اختر مخزنين مختلفين');
  try{
    await transferStock(+window._trf.fromId,+window._trf.toId,items,window._trf.note);
    alert('✅ تم التحويل بنجاح');
    window._trf.items=[{productId:'',quantity:1}];
    drawTrRows();
  }catch(e){alert(e.message)}
}

function renderAdjustForm(el){
  const {warehouses,products,stock}=window._tr;

  el.innerHTML=`<b>الرصيد الحالي:</b> <span class="mono">${cur}</span>`;

async function doAdjust(){
  if(!window._adj.productId)return alert('اختر المنتج');

    await adjustStock(+window._adj.productId,+window._adj.warehouseId,+window._adj.newQty,window._adj.note);
    alert('✅ تم التسوية');
    renderPage();
  }catch(e){alert(e.message)}
}

async function backup(){

  for(const s of ['settings','warehouses','products','customers','suppliers','invoices','invoice_items','payments','movements','stock']){
    data[s]=await all(s);
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});

async function restore(file){
  if(!file)return;
  if(!confirm('سيتم استبدال كل البيانات. متابعة؟'))return;
  const data=JSON.parse(await file.text());
  for(const s of Object.keys(data)){
    await new Promise(res=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();tx.oncomplete=res});
    for(const row of data[s])
      await new Promise(res=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).put(row);tx.oncomplete=res});
  }
  alert('✅ تم الاستيراد');location.reload();
}
